<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surgery Exam Practice Tool</title>
    <script src="css/tailwind.css"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="js/Tone.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="antialiased">

    <!-- Main Container -->
    <div id="main-container" class="min-h-screen p-4 sm:p-6 lg:p-8">
        <header class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-bold text-slate-800">Surgery Board Viva</h1>
            <p class="text-slate-500 mt-2">Select a box to draw a random question card.</p>
        </header>

        <!-- Boards Container -->
        <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Board 1 -->
            <div class="board-gradient p-6 rounded-2xl shadow-lg">
                <h2 class="text-2xl font-bold text-center text-slate-700 mb-6">Board 1</h2>
                <div id="board-1-boxes" class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div onclick="pickQuestion('BOX_1')" class="box-card bg-white p-6 rounded-xl shadow-md cursor-pointer text-center">
                        <h3 class="text-xl font-semibold text-indigo-600">Box 1</h3>
                    </div>
                    <div onclick="pickQuestion('BOX_2')" class="box-card bg-white p-6 rounded-xl shadow-md cursor-pointer text-center">
                        <h3 class="text-xl font-semibold text-indigo-600">Box 2</h3>
                    </div>
                </div>
            </div>

            <!-- Board 2 -->
            <div class="board-gradient p-6 rounded-2xl shadow-lg">
                <h2 class="text-2xl font-bold text-center text-slate-700 mb-6">Board 2</h2>
                <div id="board-2-boxes" class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div onclick="pickQuestion('BOX_3')" class="box-card bg-white p-6 rounded-xl shadow-md cursor-pointer text-center">
                        <h3 class="text-xl font-semibold text-purple-600">Box 3</h3>
                    </div>
                    <div onclick="pickQuestion('BOX_4')" class="box-card bg-white p-6 rounded-xl shadow-md cursor-pointer text-center">
                        <h3 class="text-xl font-semibold text-purple-600">Box 4</h3>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Question Modal -->
    <div id="question-modal" class="fixed inset-0 bg-black bg-opacity-60 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden perspective">
        <div id="question-card" class="card w-full max-w-2xl grid grid-cols-1 grid-rows-1">
            <div class="card-face card-face-front col-start-1 row-start-1 bg-white rounded-2xl shadow-lg"></div>
            <div class="card-face card-face-back col-start-1 row-start-1 flex flex-col w-full h-full max-h-[80vh] bg-white rounded-2xl shadow-2xl overflow-hidden">
                <div class="p-6 border-b border-slate-200 flex justify-between items-center flex-shrink-0">
                    <h3 id="question-box-title" class="text-2xl font-bold text-slate-700"></h3>
                    <button onclick="hideQuestion()" class="text-slate-400 hover:text-slate-600 text-3xl font-light leading-none w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100">&times;</button>
                </div>
                <div class="p-6 overflow-y-auto flex-grow min-h-0">
                    <p id="question-topic" class="text-lg font-semibold text-slate-800 mb-4"></p>
                    <ul id="question-list" class="space-y-3 list-disc list-inside text-slate-600"></ul>
                </div>
                <div class="p-6 bg-slate-50 rounded-b-2xl border-t border-slate-200 flex-shrink-0">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-sm font-medium text-slate-500">Timer</span>
                        <span id="timer-display" class="text-lg font-bold text-slate-700"></span>
                    </div>
                    <div class="w-full bg-slate-200 rounded-full h-2.5 timer-progress-bar">
                        <div id="timer-progress" class="bg-indigo-500 h-2.5 rounded-full"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black bg-opacity-60 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold">Settings</h3>
                <button onclick="closeSettings()" class="text-slate-400 hover:text-slate-600 text-3xl font-light leading-none w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100">&times;</button>
            </div>
            <div>
                <label for="timer-duration" class="block text-sm font-medium text-slate-700 mb-2">Question Timer (seconds)</label>
                <input type="number" id="timer-duration" class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500" min="5" value="60">
            </div>
            <div class="mt-6 text-right">
                <button onclick="saveSettings()" class="bg-indigo-600 text-white font-semibold px-4 py-2 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">Save</button>
            </div>
        </div>
    </div>
    
    <!-- Settings Icon -->
     <a href="./mcq.html">MCQ</a>
    <div class="fixed bottom-6 right-6">
        <button onclick="openSettings()" class="settings-icon bg-white p-4 rounded-full shadow-lg hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
            <svg class="w-6 h-6 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        </button>
    </div>

    <script src="data/questions.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
